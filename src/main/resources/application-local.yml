spring:
  config:
    activate:
      on-profile: local

  thymeleaf:
    check-template-location: false

  datasource:
    url: jdbc:h2:mem:reservation
    username: admin
    password: password
    driverClassName: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  h2:
    console.enabled: true

server:
  servlet:
    context-path: /
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    com.digicert.hotel.reservation: TRACE