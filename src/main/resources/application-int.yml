server:
  servlet:
    context-path: /
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: DEBUG

spring:
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://ob-authentication-service-int.cappay.npr-plipay.asgard.capi

  config:
    activate:
      on-profile: int

  datasource:
    url: jdbc:h2:mem:reservation
    username: admin
    password: password
    driverClassName: org.h2.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  h2:
    console.enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs # Default
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none  # or full
  paths-to-match: /api/**   # Optional: only include endpoints like /ap