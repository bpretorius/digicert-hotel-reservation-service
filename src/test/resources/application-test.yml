spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:reservation
    username: admin
    password: password
    driverClassName: org.h2.Driver

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    generated-ddl: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    context-path: /
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    com.hotel.reservation: TRACE