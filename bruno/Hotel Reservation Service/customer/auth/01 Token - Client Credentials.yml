info:
  name: 01 Token - Client Credentials
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/oauth2/token"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
      - name: client_id
        value: 05d0c763-b23d-4cd5-b628-63fde9ab7227
      - name: client_secret
        value: password
      - name: scope
        value: openid

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if (data && data.access_token) {
          bru.setVar("accessToken", data.access_token);
          console.log("accessToken stored as runtime variable");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
